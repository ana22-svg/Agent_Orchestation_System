services:
  app:
    build: .
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      CHROMA_HOST: chroma
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_started

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  chroma:
    image: chromadb/chroma:0.5.23
    volumes:
      - chroma-data:/chroma/chroma

volumes:
  chroma-data: